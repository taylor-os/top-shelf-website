name: Auto-expire sample sites

on:
  schedule:
    - cron: '17 8 * * *'   # daily at 08:17 UTC
  workflow_dispatch:         # allow manual trigger

permissions:
  contents: write

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --apply is required now that the script defaults to a dry run. Without
      # it this job would report and change nothing, which looks identical to a
      # working safeguard in the run log. The window is 60 days, stamped at build
      # time by ss_build.EXPIRY_DAYS; this job only reads the date already in the
      # manifest and never computes one of its own.
      - name: Expire samples past their expiry date
        run: python scripts/expire_samples.py "$(date -u +%F)" --apply

      - name: Commit archived samples (if any)
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add demo/
            git commit -m "chore: auto-expire samples past their 60-day window"
            git push
          else
            echo "Nothing to expire today."
          fi
