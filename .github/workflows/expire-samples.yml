name: Auto-expire sample sites

on:
  schedule:
    - cron: '17 8 * * *'   # daily at 08:17 UTC
  workflow_dispatch:         # allow manual trigger

permissions:
  contents: write

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Expire samples past 30 days
        run: python scripts/expire_samples.py "$(date -u +%F)"

      - name: Commit archived samples (if any)
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add demo/
            git commit -m "chore: auto-expire samples past 30 days"
            git push
          else
            echo "Nothing to expire today."
          fi
