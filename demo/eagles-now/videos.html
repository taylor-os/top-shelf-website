<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Videos | Eagles Now by Chat Sports</title>
<meta name="description" content="The latest Eagles Now uploads. Filter by type, search the titles and watch without leaving the page.">
<link rel="icon" href="assets/avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="videos">
<a class="skip" href="#main">Skip to content</a>
<header class="site-head" id="site-head"></header>
<noscript><p>This demo renders its content with JavaScript. Turn it on to see the site.</p></noscript>

<main id="main">
  <section class="phead">
    <div class="wrap">
      <p class="kicker">Eagles Now / Videos</p>
      <h1>The video desk</h1>
      <p class="lede">The latest uploads from the channel. Filter by type or search for a name, then watch right here.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="chips" id="vid-chips" role="group" aria-label="Filter by type"></div>
      <div class="controls">
        <div class="field">
          <label for="vid-q">Search titles</label>
          <input type="search" id="vid-q" placeholder="Try a player or a team">
        </div>
        <div class="field narrow">
          <label for="vid-sort">Sort</label>
          <select id="vid-sort">
            <option value="date">Newest first</option>
            <option value="views">Most viewed</option>
          </select>
        </div>
      </div>
      <p class="meta count" id="vid-count" aria-live="polite"></p>
      <ol class="feed two" id="vid-feed"></ol>
    </div>
  </section>
</main>

<footer class="site-foot" id="site-foot"></footer>

<script defer src="data.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.min.js"></script>
<script defer src="app.js"></script>
</body>
</html>
