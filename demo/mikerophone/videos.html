<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Videos | Mikerophone</title>
<meta name="description" content="The latest Mikerophone uploads. Search the titles, sort them and watch without leaving the page.">
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,800;1,800;1,900&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="videos">
<a class="skip" href="#main">Skip to content</a>
<header class="site-head" id="site-head"></header>
<noscript><p>This demo renders its content with JavaScript. Turn it on to see the site.</p></noscript>

<main id="main">
  <section class="phead">
    <div class="wrap">
      <p class="kicker">Fresh off the mic</p>
      <h1>Latest videos</h1>
      <p class="lede">The newest uploads from the channel. Search for a name, then press play right here.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="controls">
        <div class="field">
          <label for="vid-q">Search titles</label>
          <input type="search" id="vid-q" placeholder="Try a player or a team">
        </div>
        <div class="field narrow">
          <label for="vid-sort">Sort</label>
          <select id="vid-sort">
            <option value="date">Newest first</option>
            <option value="views">Most viewed</option>
            <option value="length">Longest</option>
          </select>
        </div>
      </div>
      <p class="meta count-line" id="vid-count" aria-live="polite"></p>
      <ol class="vlist" id="vid-list"></ol>
    </div>
  </section>
</main>

<footer class="site-foot" id="site-foot"></footer>

<script defer src="data.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.min.js"></script>
<script defer src="app.js"></script>
</body>
</html>
