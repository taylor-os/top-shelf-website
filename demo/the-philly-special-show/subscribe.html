<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Get Updates | The Philly Special Show</title>
<meta name="description" content="Sign up for updates from The Philly Special Show and choose what you hear about: new episodes, articles, merch drops and game-day alerts.">
<link rel="icon" href="assets/josh-davis.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="subscribe">
<noscript><p>This demo renders its content with JavaScript. Turn it on to see the site.</p></noscript>
<a class="skip" href="#main">Skip to content</a>
<header class="site-head" id="site-head"></header>

<main id="main">
  <section class="phead">
    <div class="wrap">
      <p class="eyebrow">Get updates</p>
      <h1>Stay in the huddle</h1>
      <p class="lede">Tell us what you want to hear about. You pick the topics, and nothing else shows up.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap" style="max-width:760px">
      <!-- data-demo: handled entirely in app.js. No network request is made and nothing is stored. -->
      <form class="form" data-demo>
        <div class="field">
          <label for="sub-email">Email (required)</label>
          <input type="email" id="sub-email" name="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="sub-error">
        </div>
        <div class="field">
          <label for="sub-name">First name (optional)</label>
          <input type="text" id="sub-name" name="firstName" autocomplete="given-name">
        </div>
        <fieldset>
          <legend>Send me</legend>
          <div class="checks">
            <label><input type="checkbox" name="topics" value="new episodes" checked> New episodes</label>
            <label><input type="checkbox" name="topics" value="articles" checked> Articles</label>
            <label><input type="checkbox" name="topics" value="merch drops"> Merch drops</label>
            <label><input type="checkbox" name="topics" value="game-day alerts"> Game-day alerts</label>
          </div>
        </fieldset>
        <p class="error" id="sub-error" data-error role="alert"></p>
        <button type="submit" class="btn">Sign me up</button>
        <p class="fine">This is a demo form. Nothing you type here is sent or saved.</p>
      </form>
    </div>
  </section>
</main>

<footer class="site-foot" id="site-foot"></footer>

<script defer src="data.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.min.js"></script>
<script defer src="app.js"></script>
</body>
</html>
