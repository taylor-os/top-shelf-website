<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Episodes | The Thomas Mott Show</title>
<meta name="description" content="The most recent videos from The Thomas Mott Show. Search them, sort them and watch right here.">
<link rel="icon" href="assets/avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="episodes">
<a class="skip" href="#main">Skip to content</a>
<header class="site-head" id="site-head"></header>
<noscript><p>This demo renders its content with JavaScript. Turn it on to see the site.</p></noscript>

<main id="main">
  <div class="wrap page-head">
    <p class="eyebrow">Episodes</p>
    <h1 class="display">Watch the recent <em>episodes.</em></h1>
    <p class="lede">The latest uploads from the channel. Tap one and it plays right here.</p>
  </div>

  <section class="section alt" aria-label="Recent videos">
    <div class="wrap">
      <div class="tools">
        <div class="field">
          <label for="ep-q">Search titles</label>
          <input type="search" id="ep-q" placeholder="Try “Howie”" autocomplete="off">
        </div>
        <div class="field">
          <label for="ep-sort">Sort by</label>
          <select id="ep-sort">
            <option value="date">Newest</option>
            <option value="views">Most viewed</option>
          </select>
        </div>
      </div>
      <p class="meta" id="ep-count" aria-live="polite"></p>
      <ul class="stories cards" id="ep-list"></ul>
      <div class="btn-row" id="ep-all"></div>
    </div>
  </section>
</main>

<footer class="site-foot" id="site-foot"></footer>

<script defer src="data.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.min.js"></script>
<script defer src="app.js"></script>
</body>
</html>
