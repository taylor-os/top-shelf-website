<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Get updates | The Thomas Mott Show</title>
<meta name="description" content="Sign up for updates from The Thomas Mott Show and pick what you hear about.">
<link rel="icon" href="assets/avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="subscribe">
<a class="skip" href="#main">Skip to content</a>
<header class="site-head" id="site-head"></header>
<noscript><p>The signup form needs JavaScript. Turn it on to use it.</p></noscript>

<main id="main">
  <div class="wrap page-head">
    <p class="eyebrow">Get updates</p>
    <h1 class="display">Updates from the show, <em>by email.</em></h1>
    <p class="lede">Choose which emails you get.</p>
  </div>

  <section class="section alt" aria-label="Signup form">
    <div class="wrap">
      <form class="form" data-demo>
        <div class="field">
          <label for="sub-email">Email (required)</label>
          <input type="email" id="sub-email" name="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="sub-error">
        </div>
        <div class="field">
          <label for="sub-name">First name (optional)</label>
          <input type="text" id="sub-name" name="firstName" autocomplete="given-name">
        </div>
        <fieldset>
          <legend>Send me</legend>
          <div class="checks">
            <label class="check"><input type="checkbox" value="new videos" checked> New videos</label>
            <label class="check"><input type="checkbox" value="game day reminders" checked> Game day reminders</label>
            <label class="check"><input type="checkbox" value="merch news"> Merch news</label>
            <label class="check"><input type="checkbox" value="sponsor codes"> Sponsor codes</label>
          </div>
        </fieldset>
        <p class="error" id="sub-error" data-error role="alert"></p>
        <div><button type="submit" class="btn">Sign me up</button></div>
        <p class="fine">This is a demo form. Nothing you type here is sent or saved.</p>
      </form>
    </div>
  </section>
</main>

<footer class="site-foot" id="site-foot"></footer>

<script defer src="data.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.min.js"></script>
<script defer src="app.js"></script>
</body>
</html>
