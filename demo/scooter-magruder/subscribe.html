<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Get Updates | Scooter Magruder</title>
<meta name="description" content="Sign up for email updates from Scooter Magruder and choose which series you hear about.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23FF7A1A' stroke='%2315132E' stroke-width='5'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='900' font-family='Arial' text-anchor='middle' fill='%2315132E'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="subscribe">
<a class="skip" href="#main">Skip to content</a>
<header class="site-head" id="site-head"></header>
<noscript><p>This demo renders its content with JavaScript. Turn it on to see the site.</p></noscript>

<main id="main">
  <section class="phead">
    <div class="wrap">
      <p class="tag t2 tilt">Get updates</p>
      <h1>New videos by email</h1>
      <p class="lede">Choose which series you want to hear about.</p>
    </div>
  </section>

  <section class="section tight">
    <div class="wrap narrow">
      <!-- data-demo: handled entirely in app.js. No network request is made and nothing is stored. -->
      <form class="form" data-demo>
        <div class="field">
          <label for="sub-email">Email (required)</label>
          <input type="email" id="sub-email" name="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="sub-error">
        </div>
        <div class="field">
          <label for="sub-name">First name (optional)</label>
          <input type="text" id="sub-name" name="firstName" autocomplete="given-name">
        </div>
        <fieldset>
          <legend>Send me</legend>
          <div class="checks" id="sub-series"></div>
        </fieldset>
        <p class="error" id="sub-error" data-error role="alert"></p>
        <div><button type="submit" class="btn">Sign me up</button></div>
        <p class="fine">This is a demo form. Nothing you type here is sent or saved.</p>
      </form>
    </div>
  </section>
</main>

<footer class="site-foot dark" id="site-foot"></footer>

<script defer src="data.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.min.js"></script>
<script defer src="app.js"></script>
</body>
</html>
