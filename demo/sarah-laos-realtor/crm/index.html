<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realtor CRM Renders</title><meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF8F2;--ink:#1B201D;--ink2:#555850;--forest:#22302A;--brass:#A07D47;--line:rgba(27,32,29,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 Jost,system-ui,sans-serif}
header{background:var(--forest);color:#fff;padding:56px 24px 48px}
.w{max-width:1180px;margin:0 auto}
small{color:#C9A56B;letter-spacing:.2em;text-transform:uppercase;font-size:12px}
h1{font:500 clamp(34px,5vw,52px)/1.05 "Cormorant Garamond",Georgia,serif;margin:0}
header p{color:#D7D3C9;max-width:760px;margin:0}
main{padding:40px 24px 64px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
figure img{width:100%;display:block;max-height:560px;object-fit:cover;object-position:top}
figure.ph img{max-height:560px;object-fit:contain;background:#F3EDE2}
figcaption{padding:16px 18px 20px;color:var(--ink2);font-size:15px}
figcaption b{display:block;color:var(--ink);font:500 22px/1.2 "Cormorant Garamond",Georgia,serif;margin-bottom:4px}
.note{margin-top:36px;font-size:14px;color:var(--ink2)}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="w"><h1>A custom Realtor CRM just for you.</h1></div></header>
<main><div class="w"><div class="grid"><figure class=""><a href="today.png" target="_blank"><img src="today.png" alt="Today screen" loading="lazy"></a><figcaption><b>Today</b>Her morning list: who to call and why, every deadline in the next 10 days whether she represents the buyer or the seller, website leads with how long they've waited, and the day's showings with lockbox notes.</figcaption></figure><figure class=""><a href="listings.png" target="_blank"><img src="listings.png" alt="Listings screen" loading="lazy"></a><figcaption><b>Listings</b>Every listing with its MLS status, the plain label her website shows, days on market, when the listing agreement expires, and inquiries and showings.</figcaption></figure><figure class=""><a href="listing-edit.png" target="_blank"><img src="listing-edit.png" alt="Editing a listing screen" loading="lazy"></a><figcaption><b>Editing a listing</b>Photos (drag to reorder, first one is the website cover), details buyers ask about, private showing instructions, and a live preview of the card on her website. Save & publish updates the site.</figcaption></figure><figure class=""><a href="contacts.png" target="_blank"><img src="contacts.png" alt="Contacts screen" loading="lazy"></a><figcaption><b>Contacts</b>Sorted by who needs her next, with phone numbers, stage and the next step on every row.</figcaption></figure><figure class=""><a href="contact.png" target="_blank"><img src="contact.png" alt="Buyer profile screen" loading="lazy"></a><figcaption><b>Buyer profile</b>What the buyer wants (must-haves, nice-to-haves, deal-breakers), the buyer agreement, pre-approval and loan officer, homes that match, and the full history of calls, showings and notes.</figcaption></figure><figure class=""><a href="pipeline.png" target="_blank"><img src="pipeline.png" alt="Pipeline screen" loading="lazy"></a><figcaption><b>Pipeline</b>Buyers by stage, from new lead to closed. Each card says what the dollar figure is.</figcaption></figure><figure class=""><a href="deal.png" target="_blank"><img src="deal.png" alt="Deal under contract screen" loading="lazy"></a><figcaption><b>Deal under contract</b>Texas contract deadlines with a checkbox, days left and who owns each step, the red option-period warning, terms, people and documents.</figcaption></figure><figure class="ph"><a href="mobile-today.png" target="_blank"><img src="mobile-today.png" alt="Phone: Today screen" loading="lazy"></a><figcaption><b>Phone: Today</b>Search at the top, the deadline banner, one-tap call and done on every row, and every appointment.</figcaption></figure><figure class="ph"><a href="mobile-contact.png" target="_blank"><img src="mobile-contact.png" alt="Phone: Buyer profile screen" loading="lazy"></a><figcaption><b>Phone: Buyer profile</b>Call Linda or Ray directly, the wish list with deal-breakers, agreement and lender at a glance, and matches.</figcaption></figure></div>
<p class="note">Sample data for preview. Client names, listings and figures are illustrative.</p></div></main></body></html>
