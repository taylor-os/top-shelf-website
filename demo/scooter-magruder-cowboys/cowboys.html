<title>Cowboys season | Scooter Magruder</title>
<meta name="description" content="The Dallas Cowboys season on Scooter Magruder's site: the record, results so far, a countdown to the next game, the rest of the schedule and his Cowboys videos.">

<body data-page="cowboys">
<a class="skip" href="#main">Skip to content</a>
<header class="site-head" id="site-head"></header>
<noscript><p>This demo renders its content with JavaScript. Turn it on to see the site.</p></noscript>

<main id="main">
  <section class="phead">
    <div class="wrap">
      <p class="kicker" data-text="team.name"></p>
      <h1><span data-text="season.year"></span> Cowboys season</h1>
      <p class="lede" data-text="team.note"></p>
    </div>
  </section>

  <section class="section tight" aria-labelledby="h-board">
    <div class="wrap">
      <h2 class="sr-only" id="h-board">Record and next game</h2>
      <div class="board">
        <p class="record" data-slot="record"></p>
        <div id="next-game" data-if-next></div>
      </div>
    </div>
  </section>

  <section class="section tight">
    <div class="wrap split">
      <div>
        <div class="sec-head"><h2 id="h-results">Results so far</h2></div>
        <div id="results"></div>
      </div>
      <div>
        <div class="sec-head"><h2 id="h-sched">Still to play</h2></div>
        <div id="sched"></div>
      </div>
    </div>
  </section>

  <section class="section rule" aria-labelledby="h-cbv">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <p class="kicker">Watch</p>
          <h2 id="h-cbv">Cowboys videos</h2>
        </div>
        <a class="more" href="videos.html">All videos</a>
      </div>
      <p class="count" id="cb-count"></p>
      <div class="grid" id="cb-videos"></div>
    </div>
  </section>
</main>

<footer class="site-foot" id="site-foot"></footer>

<script defer src="app.js"></script>
