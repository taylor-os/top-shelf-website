<body data-page="merch">
<a class="skip" href="#main">Skip to content</a>
<header class="site-head" id="site-head"></header>
<noscript><p>This demo renders its content with JavaScript. Turn it on to see the site.</p></noscript>

<main id="main">
  <section class="phead">
    <div class="wrap">
      <p class="kicker">Merch</p>
      <h1>The Grown Man store</h1>
      <p class="lede">Picks from his store. Each button opens the product on the store’s own site, where you check out.</p>
    </div>
  </section>

  <section class="section tight" aria-labelledby="h-shop">
    <div class="wrap">
      <h2 class="sr-only" id="h-shop">Products</h2>
      <div class="chips" id="merch-chips" role="group" aria-label="Filter by design"></div>
      <p class="count" id="merch-count" aria-live="polite"></p>
      <div class="grid" id="merch-grid"></div>
      <p class="fine">Prices as listed when this demo was built. The store has the current price.</p>
      <div class="btn-row">
        <a class="btn" data-href="merch.storeUrl" target="_blank" rel="noopener">Visit the Grown Man store</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-foot" id="site-foot"></footer>
